<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#091011" />
  <meta name="description" content="ThunderCats: Third Earth. A twenty-mission single-player arcade adventure." />
  <title>ThunderCats — Third Earth</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23de5437'/%3E%3Cpath d='M10 27V13l8 7 11-9-3 18-8-6z' fill='%230b1214'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <header class="masthead">
      <a class="brand" href="./" aria-label="ThunderCats home"><img class="sigil" src="assets/thundercats-emblem.png" alt="ThunderCats emblem"><span>THUNDERCATS<span class="brand-sub">THIRD EARTH</span></span></a>
      <div class="edition"><i></i> SINGLE PLAYER <span>18 MISSIONS</span></div>
      <div class="toolbar"><button id="soundButton" class="icon-button" aria-label="Toggle sound" title="Toggle sound (M)">♫</button><button id="fullscreenButton" class="icon-button" aria-label="Fullscreen" title="Fullscreen (F)">⛶</button><button id="helpButton" class="help-button">HOW TO PLAY <span>?</span></button></div>
    </header>
    <section class="cabinet" aria-label="ThunderCats game">
      <div class="cabinet-label"><span><b></b> THIRD EARTH · ARCADE ADVENTURES</span><span>HAND-DRAWN / HD</span></div>
      <div class="screen" id="screen">
        <canvas id="game" width="960" height="540" aria-label="ThunderCats single-player arcade campaign"></canvas>
        <div class="scanlines" aria-hidden="true"></div>
        <nav id="heroSwitch" class="hero-switch" aria-label="Switch ThunderCat" hidden><span>SWITCH · Q/E</span><button data-input="hero0" aria-label="Switch to Lion-O">1 · LION-O</button><button data-input="hero1" aria-label="Switch to Cheetara">2 · CHEETARA</button><button data-input="hero2" aria-label="Switch to Panthro">3 · PANTHRO</button><button data-input="hero3" aria-label="Switch to Tygra">4 · TYGRA</button></nav>
        <div id="overlay" class="overlay"></div>
        <div id="toast" class="toast" role="status"></div>
      </div>
      <div class="cabinet-bottom"><span><i></i> <span id="systemStatus">SYSTEM READY</span></span><span id="bottomHint">KEYBOARD + GAMEPAD SUPPORTED</span><span>EST. 1985 <b>✦</b></span></div>
    </section>
    <footer class="page-footer"><div><span class="footer-line"></span> ONE HERO. EVERY FRONT. <em>THIRD EARTH NEEDS YOU.</em></div><span>A FAN-MADE ARCADE ADVENTURE</span></footer>
    <div class="touch-controls" id="touchControls"><div class="touch-move"><button data-input="up">▲</button><button data-input="left">◀</button><button data-input="down">▼</button><button data-input="right">▶</button></div><div class="touch-actions"><button data-input="jump">JUMP</button><button data-input="attack">HIT</button><button data-input="special">POWER</button><button data-input="dodge">DODGE</button></div></div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
